<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Tap 3D</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#40517d,#0b1020 65%);font-family:system-ui;color:#fff;display:grid;place-items:center}.game{width:min(94vw,520px);text-align:center}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.title{font-size:30px;font-weight:900}.scorebox{background:#18213a;border:2px solid #52628d;border-radius:14px;padding:6px 14px}.scorebox small{display:block;font-size:10px;color:#aeb9d6}.score{font-size:23px;font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:11px;background:#080d1b;border:3px solid #52628d;border-radius:20px;box-shadow:0 12px 0 #050811,0 20px 35px #0008}.cell{aspect-ratio:1;background:#151d33;border-radius:13px;display:grid;place-items:center}.tile{width:82%;height:82%;border-radius:14px;display:grid;place-items:center;font-size:clamp(18px,6vw,30px);font-weight:1000;cursor:pointer;box-shadow:inset 0 4px #fff5,0 7px #0007;transition:.12s}.tile:active{transform:translateY(3px)}.selected{outline:4px solid white;filter:brightness(1.35)}.t1{background:linear-gradient(#56d8ff,#1676d2)}.t2{background:linear-gradient(#6df58d,#159c55)}.t3{background:linear-gradient(#ffd95b,#e67b12)}.t4{background:linear-gradient(#ff78c8,#bd2e91)}.t5{background:linear-gradient(#b58cff,#6542cf)}.t6{background:linear-gradient(#ff7373,#d72e3f)}.t7{background:linear-gradient(#58f0e8,#168f9a)}.t8{background:linear-gradient(#f6f66b,#a9a40c)}.controls{display:flex;gap:10px;justify-content:center;margin-top:15px}.btn{border:0;border-radius:13px;padding:11px 18px;background:#263453;color:#fff;font-weight:800;font-size:15px;box-shadow:0 5px #080c15}.help{color:#aeb9d6;font-size:13px;margin-top:12px}.over{position:fixed;inset:0;background:#050813cc;display:none;place-items:center}.card{background:#18213a;border:2px solid #52628d;border-radius:22px;padding:28px;text-align:center}.card h2{font-size:30px;margin:0}.card p{color:#b9c3dc}</style></head><body><main class="game"><div class="top"><div class="title">🧊 Merge Tap 3D</div><div class="scorebox"><small>SCORE</small><span class="score" id="score">0</span></div></div><div class="board" id="board"></div><div class="controls"><button class="btn" id="new">↻ New Game</button><button class="btn" id="undo">↶ Undo</button></div><div class="help">Tap two matching blocks next to each other to merge them. Build the biggest number!</div></main><div class="over" id="over"><div class="card"><h2>Game Over!</h2><p>Final score: <b id="final">0</b></p><button class="btn" id="again">Play Again</button></div></div><script>const N=5,B=document.querySelector('#board'),S=document.querySelector('#score'),O=document.querySelector('#over');let g=[],score=0,sel=null,hist=[];const vals=[1,1,1,2,2,2,3,3,4,4,5,6];function start(){g=Array.from({length:25},()=>Math.random()<.22?vals[Math.floor(Math.random()*vals.length)]:0);score=0;sel=null;hist=[];O.style.display='none';draw()}function adj(a,b){return Math.abs(a-b)==1&&Math.floor(a/N)==Math.floor(b/N)||Math.abs(a-b)==N}function draw(){B.innerHTML='';S.textContent=score;g.forEach((v,i)=>{let c=document.createElement('div');c.className='cell';if(v){let t=document.createElement('div');t.className='tile t'+Math.min(v,8)+(sel===i?' selected':'');t.textContent=v;t.onclick=()=>tap(i);c.append(t)}B.append(c)})}function tap(i){if(!g[i])return;if(sel===null){sel=i;draw();return}if(sel===i){sel=null;draw();return}if(adj(sel,i)&&g[sel]===g[i]){hist.push({g:[...g],score});let v=g[i]+1;g[i]=v;g[sel]=0;score+=v*10;sel=null;let e=g.map((x,j)=>x?null:j).filter(x=>x!==null);if(e.length){let p=e[Math.floor(Math.random()*e.length)];g[p]=Math.random()<.8?1:2}draw();if(!move())setTimeout(()=>{document.querySelector('#final').textContent=score;O.style.display='grid'},250)}else{sel=i;draw()}}function move(){for(let i=0;i<25;i++)if(g[i])for(let d of[-1,1,-5,5]){let j=i+d;if(j>=0&&j<25&&adj(i,j)&&g[j]===g[i])return true}return false}document.querySelector('#new').onclick=start;document.querySelector('#again').onclick=start;document.querySelector('#undo').onclick=()=>{if(hist.length){let h=hist.pop();g=h.g;score=h.score;sel=null;draw()}};start();</script></body></html>
